version: 2
updates:

  # ── npm / pnpm workspace ──────────────────────────────────────────────────
  # directory: "/" is the only valid option for a pnpm workspace. pnpm refuses
  # to run from subdirectories when pnpm-lock.yaml and pnpm-workspace.yaml
  # exist in a parent. Dependabot discovers workspace members via
  # pnpm-workspace.yaml and updates all of them from the root in one job.
  # .npmrc at the repo root pins registry=https://registry.npmjs.org/ to
  # prevent Dependabot from routing @scope/* packages through GitHub Packages.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    groups:
      # Angular packages must move in lockstep — a version mismatch between
      # @angular/core and @angular/compiler-cli breaks the build.
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@angular-eslint/*"
          - "zone.js"

      # NestJS framework packages are equally version-coupled.
      nestjs:
        patterns:
          - "@nestjs/*"
          - "nestjs-*"

      # Remaining devDependencies not claimed by angular/nestjs above.
      # Covers: typescript, eslint, jest, ts-jest, vitest, prettier,
      # @types/*, nodemon, tsx, supertest, tsconfig-paths, globals, etc.
      dev-tooling:
        dependency-type: "development"
        patterns:
          - "*"

      # All remaining production dependencies:
      # @supabase/supabase-js, socket.io, graphile-worker, zod, luxon,
      # jose, ws, rxjs, @taiga-ui/*, @maskito/*, @ng-web-apis/*,
      # lightweight-charts, reflect-metadata, class-transformer,
      # class-validator.
      production-deps:
        dependency-type: "production"
        patterns:
          - "*"

    ignore:
      # Angular 22 pins a hard peer range: typescript ">=6.0 <6.1"
      # (@angular/compiler-cli and @angular/build — same range on 22.0.3,
      # 22.0.5 and 22.0.6). A TypeScript major bump makes `ng build` refuse to
      # compile and the Vercel deploy fail; PR #46 bumped it to 7.0.2 and died.
      # Minor and patch TypeScript updates still flow.
      # Lift this once Angular widens the range — expected in Angular 23.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

      # ── Expo SDK-governed packages ───────────────────────────────────────
      # expo/bundledNativeModules.json, shipped inside the installed `expo`
      # package, fixes the version of each package below for the SDK in use.
      # Dependabot has no knowledge of that matrix, so it proposes whatever npm
      # published last: PR #123 offered react-native 0.87.1 against an SDK 57
      # tree that expects 0.86.x, and reanimated 4.6.0 / worklets 0.12.1 against
      # the pins added in #119. The 0.12.x worklets bump is the exact break that
      # made the iOS build fail to compile in #117.
      #
      # These versions move when the SDK moves — `expo install --fix` as part of
      # an SDK upgrade — never on an unrelated upstream release. `expo` itself is
      # deliberately NOT listed: its bump is the signal that the others may move,
      # and it must keep arriving.
      #
      # Two of them (react-native-worklets, react-native-reanimated) are also
      # pinned by `overrides` in pnpm-workspace.yaml. For those a Dependabot bump
      # is worse than merely unwanted: pnpm rewrites the specifier back to the
      # override, `pnpm install --frozen-lockfile` still passes, and the PR goes
      # green while leaving apps/mobile/package.json declaring a version that is
      # neither installed nor linked.
      #
      # `update-types` is spelled out rather than left bare on purpose: naming
      # the version-update types scopes each rule to version updates only, so
      # Dependabot SECURITY updates for these packages still arrive. A bare
      # `dependency-name` rule would suppress those too.
      #
      # Lift an entry only when the SDK it is tied to no longer governs the
      # package. The list is derived, not curated — regenerate it with:
      #   node -e "const b=require('expo/bundledNativeModules.json'),\
      #     p=require('./apps/mobile/package.json');\
      #     console.log(Object.keys({...p.dependencies,...p.devDependencies})\
      #       .filter(k=>b[k]).sort().join('\n'))"
      - dependency-name: "@react-native-community/netinfo"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "eslint-config-expo"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "expo-constants"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "expo-linking"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "expo-router"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "expo-secure-store"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "expo-status-bar"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "jest-expo"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "react-native"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "react-native-reanimated"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "react-native-safe-area-context"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "react-native-screens"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "react-native-worklets"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  # ── GitHub Actions ────────────────────────────────────────────────────────
  # No workflows exist today — the Render keepalive cron was retired in favour of
  # an external uptime monitor — so this ecosystem opens no PRs. Retained so the
  # first workflow added (a CI pipeline running pnpm build / pnpm test) has its
  # `uses:` references tracked from day one.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
