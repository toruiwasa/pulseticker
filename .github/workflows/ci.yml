name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main always finish so the
  # default-branch pnpm store cache stays populated for PR branches to restore.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: build + test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # apps/web/scripts/set-env.ts generates the gitignored
    # src/environments/environment.ts and throws if any of these is missing.
    # Every value below is a true placeholder: no spec reads the generated
    # file any more (they inject the ENVIRONMENT token — #69), so CI only
    # needs the build to compile, never to reach a live service. Real values
    # live in the Vercel project settings. APP_ENV must stay one of
    # development/staging/production, and must be listed in turbo.json's
    # build `env` — turbo 2 runs in strict env mode.
    env:
      APP_ENV: production
      SUPABASE_URL: https://ci.invalid
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      API_URL: https://ci.invalid
      WS_URL: https://ci.invalid

    steps:
      - uses: actions/checkout@v7

      # pnpm/setup installs the pnpm version pinned by `packageManager` in the
      # root package.json, and the Node runtime, in one step. `install: false`
      # keeps the install an explicit step so --frozen-lockfile is visible: it
      # is the gate that catches a lockfile out of sync with any package.json.
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Must run after Build: the web suite imports services that import the
      # generated src/environments/environment.ts, which only `pnpm build`
      # (via set-env.ts) produces. A fresh checkout has no such file.
      - name: Test
        run: pnpm test

  # Static analysis runs as its own job so it is parallel with build + test
  # rather than queued behind it (#11). It re-pays checkout + install (~25s),
  # which is free on a public repo and still lowers wall-clock, because the
  # ~30s of lint + typecheck now overlaps the ~60s of build + test instead of
  # following it.
  #
  # The split axis is "does it compile and pass tests" vs "does it satisfy
  # static analysis" — deliberately NOT "mobile vs everything else", which is
  # how #11 was originally filed. `lint` and `typecheck` are repo-wide turbo
  # tasks that any package may implement, so a per-app job would have to be
  # renegotiated when apps/web gains an eslint config, and would collide with
  # the bundle-integrity job #96 proposes. See plans/REQ-17_Task8_CI_Mobile.md.
  lint-typecheck:
    name: lint + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # No `env:` block, unlike build-test: nothing here runs `ng build`, so
    # apps/web/scripts/set-env.ts is never invoked. turbo's `^build` pulls in
    # only the packages/* builds (plain `tsc`), which read no environment.

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `turbo lint` — api and apps/mobile, both plain eslint. Reports only:
      # the `lint` script no longer carries --fix (#80), so this cannot rewrite
      # the checkout. Fails on errors; the 14 remaining no-floating-promises
      # findings in api specs are warnings and do not gate. apps/web has no
      # eslint configuration, so turbo skips it.
      #
      # Both turbo tasks declare `dependsOn: ["^build"]` because api's eslint
      # config is type-aware (`projectService: true` + recommendedTypeChecked)
      # and mobile's tsconfig resolves @pulseticker/* through `exports.types`
      # — both need packages/*/dist/*.d.ts to exist.
      - name: Lint
        run: pnpm lint

      # `turbo typecheck` — currently apps/mobile only, and it is the reason
      # this job exists. api and web are type-checked by `nest build` / `ng
      # build` inside the Build step of build-test; apps/mobile has no build
      # script, and jest-expo strips types via babel without checking them, so
      # before this step no compiler had ever seen mobile's source in CI.
      - name: Typecheck
        run: pnpm typecheck
